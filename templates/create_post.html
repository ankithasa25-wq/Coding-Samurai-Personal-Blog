<!DOCTYPE html>
<html>
<head>
    <title>Create Post - My Personal Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <h2>My Personal Blog</h2>

        <div>
            <a href="/">Home</a>
            <a href="/login">Login</a>
            <a href="/register">Register</a>
            <a href="/create_post">Create Post</a>
        </div>
    </nav>

    <div class="form-box">

        <h1>✍️ Create a New Post</h1>

        <p style="text-align: center; color: #666;">
            Share your thoughts and ideas with your readers.
        </p>

        <form method="POST">

            <label>📌 Post Title</label>
            <input type="text" name="title" placeholder="Enter your post title" required>

            <label>📝 Your Story</label>
            <textarea name="content" rows="9" placeholder="Write your thoughts here..." required></textarea>

            <button type="submit" class="button">🚀 Publish Post</button>

        </form>

    </div>

</body>
</html>

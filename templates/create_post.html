<!DOCTYPE html>
<html>
<head>
    <title>Create Post</title>
</head>
<body>

    <h1>Create a Blog Post</h1>

    <form method="POST">

        <label>Title:</label>
        <input type="text" name="title" required>

        <br><br>

        <label>Article:</label>
        <br>
        <textarea name="content" rows="10" cols="50" required></textarea>

        <br><br>

        <button type="submit">Publish Post</button>

    </form>

    <br>

    <a href="/">Back to Home</a>

</body>
</html>

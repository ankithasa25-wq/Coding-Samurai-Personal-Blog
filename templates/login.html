<!DOCTYPE html>
<html>

    <title>Login</title>
</head>
<body>

    <h1>Login</h1>

    <form method="POST">

        <label>Username:</label>
        <input type="text" name="username" required>

        <br><br>

        <button type="submit">Login</button>

    </form>

    <br>

    <a href="/register">Create an Account</a>

    <br><br>

    <a href="/">Back to Home</a>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Edit Post - My Personal Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <h2>My Personal Blog</h2>

        <div>
            <a href="/">Home</a>
            <a href="/login">Login</a>
            <a href="/register">Register</a>
            <a href="/create_post">Create Post</a>
        </div>
    </nav>

    <div class="form-box">

        <h1>✏️ Edit Your Post</h1>

        <p style="text-align: center; color: #666;">
            Update your post and save your changes.
        </p>

        <form method="POST">

            <label>📌 Post Title</label>
            <input type="text" name="title" value="{{ post['title'] }}" required>

            <label>📝 Your Story</label>
            <textarea name="content" rows="9" required>{{ post['content'] }}</textarea>

            <button type="submit" class="button">💾 Save Changes</button>

        </form>

    </div>

</body>
</html>
